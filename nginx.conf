# ═══════════════════════════════════════════════════════════════════════════════
#  Nginx configuration for the Ollama Model Scheduler
#  File:  /etc/nginx/sites-available/ollama-scheduler
#
#  Traffic topology
#  ────────────────
#
#    Client (SDK / curl / Eval harness)
#        │
#        │  :80  (or :443 with TLS termination added below)
#        ▼
#    Nginx  ─── /api/generate  ──► Python Scheduler :8080  ──► Ollama :11434
#           ─── /api/chat      ──►        ↑
#           ─── /health        ──► (same scheduler)
#           ─── /metrics       ──►
#           ─── /queue/status  ──►
#           ─── /models        ──►
#           ─── /api/*         ──► Ollama :11434  (direct — pull, show, ps, etc.)
#
#  After editing, activate with:
#     sudo ln -s /etc/nginx/sites-available/ollama-scheduler \
#                /etc/nginx/sites-enabled/ollama-scheduler
#     sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstream: Python scheduler ────────────────────────────────────────────────
upstream ollama_scheduler {
    server 127.0.0.1:8080;

    # Keep 32 idle HTTP/1.1 connections open to the scheduler.
    # This avoids TCP handshake overhead for every LLM request.
    keepalive 32;
}

# ── Upstream: Raw Ollama (for non-inference endpoints) ───────────────────────
upstream ollama_raw {
    server 127.0.0.1:11434;
    keepalive 8;
}

# ═══════════════════════════════════════════════════════════════════════════════
#  Main server block
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name _;                    # Accept any host; restrict in production

    # ── Global timeouts tuned for long-running LLM inference ─────────────────
    # A 26B model can take 30–120 s to generate a long completion.
    # These values should be >= REQUEST_TIMEOUT_S in config.py (default 600 s).
    proxy_connect_timeout   15s;
    proxy_send_timeout     120s;
    proxy_read_timeout     660s;   # slightly above Python-side 600 s timeout

    # ── Streaming / buffering ─────────────────────────────────────────────────
    # Disable proxy buffering so NDJSON chunks reach the client immediately.
    proxy_buffering        off;
    proxy_cache            off;
    proxy_request_buffering off;    # allow large base64 images without spooling

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection     "";      # required for keepalive upstreams
    proxy_set_header   Host           $host;
    proxy_set_header   X-Real-IP      $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ── Accept large bodies (vision models send base64 images) ───────────────
    client_max_body_size 200m;

    # ─────────────────────────────────────────────────────────────────────────
    #  Route 1: Inference requests  →  Python Scheduler
    #
    #  /api/generate  and  /api/chat  are intercepted here.
    #  All VRAM management, batching, and latency tracking happens inside
    #  the Python scheduler before Ollama is ever contacted.
    # ─────────────────────────────────────────────────────────────────────────
    location ~ ^/api/(generate|chat)$ {
        proxy_pass http://ollama_scheduler;

        # Critical: tell Nginx to flush NDJSON chunks as they arrive
        # rather than waiting for the full response (which never comes for
        # a streaming LLM response).
        chunked_transfer_encoding on;
        gzip off;                       # gzip + streaming = bad interaction
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  Route 2: Scheduler observability endpoints  →  Python Scheduler
    # ─────────────────────────────────────────────────────────────────────────
    location ~ ^/(health|metrics|queue|models) {
        proxy_pass http://ollama_scheduler;

        # These are JSON responses, not streams — standard timeout is fine.
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  Route 3: All other Ollama API calls  →  Ollama directly
    #
    #  Covers: /api/pull, /api/push, /api/show, /api/ps, /api/embed,
    #          /api/embeddings, /api/delete, /api/copy, /api/tags, etc.
    #  These are management calls that bypass the scheduler entirely.
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ollama_raw;
        proxy_read_timeout 300s;        # model pulls can be slow
        client_max_body_size 10m;
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  Catch-all: reject anything else cleanly
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        return 404 '{"error":"Not found. Valid prefixes: /api/generate, /api/chat, /health, /metrics, /queue/status, /models"}\n';
        add_header Content-Type application/json;
    }

    # ── Access log with timing ────────────────────────────────────────────────
    # Log upstream response time alongside the standard fields.
    # Pipe to a dedicated file to avoid polluting the default Nginx error log.
    log_format ollama_scheduler
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/ollama-scheduler.access.log ollama_scheduler;
    error_log  /var/log/nginx/ollama-scheduler.error.log  warn;
}

# ═══════════════════════════════════════════════════════════════════════════════
